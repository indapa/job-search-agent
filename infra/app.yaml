AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  job-search nightly run: EventBridge Scheduler invokes a Lambda that searches for job
  postings, ranks them against the resume in S3, writes the report to S3 and emails a summary.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI for the function, e.g. <account>.dkr.ecr.<region>.amazonaws.com/job-search:<git-sha>
  FunctionName:
    Type: String
    Default: job-search-nightly
  ScheduleExpression:
    Type: String
    Default: cron(0 22 * * ? *)
    Description: EventBridge Scheduler expression (default every day at 22:00)
  ScheduleTimezone:
    Type: String
    Default: America/Los_Angeles
  ScheduleInput:
    Type: String
    Default: '{"max_iterations": 1, "queries_per_round": 6, "verify_top_n": 8}'
    Description: >-
      config.yaml overrides for the nightly run. The default is a small run (~15 Tavily
      searches); use "{}" for the full config.yaml run.
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email for failure alerts (you must confirm the SNS subscription email)
  ReportEmail:
    Type: String
    Default: ""
    Description: >-
      Optional email for the nightly report. Leave empty to use AlertEmail. You must
      confirm the SNS subscription email.
  ApiKeyParameterPrefix:
    Type: String
    Default: /job-search
    Description: SSM path holding the GOOGLE_API_KEY and TAVILY_API_KEY SecureStrings (see infra/deploy.sh secrets)

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasReportEmail: !Not [!Equals [!Ref ReportEmail, ""]]
  NotifyReports: !Or [!Condition HasReportEmail, !Condition HasAlertEmail]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub job-search-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt Bucket.Arn
              - !Sub ${Bucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FunctionName}
      RetentionInDays: 90

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs-bucket-keys-email
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${LogGroup.Arn}:*
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${Bucket.Arn}/resume/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub ${Bucket.Arn}/reports/*
                  - !Sub ${Bucket.Arn}/state/*
              - Effect: Allow
                # Lists the resumes, and makes GetObject on a missing key return 404 rather than 403.
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ApiKeyParameterPrefix}/*
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref ReportTopic

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Ref FunctionName
      Description: Nightly job search, ranked against the resume, report to S3 and email
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures:
        - arm64
      MemorySize: 1024
      Timeout: 900
      ReservedConcurrentExecutions: 1  # never two runs at once (they share seen_jobs.json)
      Role: !GetAtt FunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          BUCKET: !Ref Bucket
          NOTIFY_TOPIC_ARN: !Ref ReportTopic
          GOOGLE_API_KEY_PARAM: !Sub ${ApiKeyParameterPrefix}/GOOGLE_API_KEY
          TAVILY_API_KEY_PARAM: !Sub ${ApiKeyParameterPrefix}/TAVILY_API_KEY

  FunctionAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref Function
      Qualifier: $LATEST
      # A retry repeats every search and API charge, so retry once only
      MaximumRetryAttempts: 1
      MaximumEventAgeInSeconds: 21600

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-function
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt Function.Arn
                  - !Sub ${Function.Arn}:*

  Schedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: job-search-nightly
      Description: Nightly job search
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt Function.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: !Ref ScheduleInput
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: job-search-alerts
      Subscription: !If
        - HasAlertEmail
        - [{Protocol: email, Endpoint: !Ref AlertEmail}]
        - !Ref AWS::NoValue

  ReportTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: job-search-reports
      DisplayName: job-search
      Subscription: !If
        - NotifyReports
        - [{Protocol: email, Endpoint: !If [HasReportEmail, !Ref ReportEmail, !Ref AlertEmail]}]
        - !Ref AWS::NoValue

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: job-search-nightly-errors
      AlarmDescription: The nightly job-search Lambda failed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Function
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

Outputs:
  BucketName:
    Value: !Ref Bucket
  ReportsUri:
    Description: Each run's CSV and PDF are under <this><date>/
    Value: !Sub s3://${Bucket}/reports/
  FunctionName:
    Value: !Ref Function
  ScheduleName:
    Value: !Ref Schedule
  ReportTopicArn:
    Description: SNS topic for the nightly email (add more subscribers here)
    Value: !Ref ReportTopic
