[project]
name = "job-search"
version = "0.1.0"
description = "LangGraph agent that searches the web for job postings matching your criteria"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.1",
    "tavily-python>=0.7",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fpdf2>=2.8.9",
    "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
job-search = "job_search.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_search"]

[tool.pytest.ini_options]
pythonpath = ["src"]
