# What you're looking for. The agent uses this to write search queries and judge each posting.
# These are example values; replace them with your own.
keywords: ["bioinformatics scientist", "computational biologist"]
employment_type: ["full-time", "contract"]    # full-time | part-time | contract | internship
work_arrangement: ["remote", "hybrid"]         # remote | hybrid | on-site
focus_areas: ["genomics", "machine learning"]
seniority: ["senior", "staff"]
exclude_keywords: []       # postings mentioning these are marked as not a match
resume_dir: "resume"       # PDF/TXT/MD resumes here are used to rank results by fit; leave empty to skip

# Run size (controls API spend)
max_iterations: 2        # search -> reflect rounds
queries_per_round: 12
results_per_query: 5
verify_top_n: 15         # jobs that get a follow-up search for missing details
model: "gemini-3.8-flash"
